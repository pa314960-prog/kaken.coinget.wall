<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シルエットコインゲット</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
    height: 100%;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 12px;
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 4 / 3;
    background: #000;
    border: 2px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }
  /* カメラ映像は表示用途のみ。実際の描画は canvas 側で行う */
  video {
    display: none;
  }
  canvas#view {
    width: 100%;
    height: 100%;
    display: block;
  }
  #status {
    margin-top: 10px;
    font-size: 0.95rem;
    min-height: 1.4em;
    text-align: center;
  }
  #controls {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  button {
    background: #2d7dfa;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #1c63d6;
  }
  .error {
    color: #ff6b6b;
  }
</style>
</head>
<body>
<div id="app">
  <h1>シルエットコインゲット — Step 1: カメラ映像（鏡像表示）</h1>
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="view"></canvas>
  </div>
  <div id="status">カメラを開始するにはボタンを押してください。</div>
  <div id="controls">
    <button id="startBtn">カメラ開始</button>
    <button id="stopBtn" disabled>カメラ停止</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
